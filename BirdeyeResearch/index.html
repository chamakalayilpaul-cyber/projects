<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No static meta description here: every route sets its own via `useDocumentMeta`
         (src/lib/head.ts), which upserts an element marked `data-managed="true"`. A static,
         unmarked description tag here would sit alongside it as a duplicate rather than being
         replaced by it, and browsers/crawlers read whichever one comes first — silently
         defeating every page's own tailored description. -->
    <title>Birdeye Research</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('__redirect');
        if (redirect) {
          history.replaceState(null, '', '/projects/BirdeyeResearch' + decodeURIComponent(redirect));
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&display=swap" rel="stylesheet" />
